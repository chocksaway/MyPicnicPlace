spring.application.name=MyPicnicPlace

# Only accept connections from this machine. The frontend's dev server proxies
# /api and /uploads here, so the browser (including LAN devices) never needs
# to reach the backend directly.
server.address=127.0.0.1

# Directory where uploaded files are stored (relative to application working dir)
upload.dir=uploads

# Limit uploads to 10MB by default
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis connection, used to index uploaded image metadata for fast lookup by id
spring.data.redis.host=localhost
spring.data.redis.port=6379

